[package]
name = "aegis-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Linux telemetry agent for AegisGraph"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"
